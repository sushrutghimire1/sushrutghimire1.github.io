<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part IV - Tree 2129: The Endless Growth</title>
    <style>
        :root {
            --void-dark: #0a0f12; /* Deep space dark */
            --bio-glow: #00e5ff;  /* Neon growth cyan */
            --forest-night: #141e1b;
            --accent-silver: #e0e0e0;
            --text-color: #cfd8dc;
            --bg-paper: #050708;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Top Navigation --- */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            min-height: 70px;
            background: rgba(10, 15, 18, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 229, 255, 0.2);
            backdrop-filter: blur(15px);
        }

        .current-part-title {
            flex: 1;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--bio-glow);
            padding: 0 10px;
        }

        .btn-back-tree {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--bio-glow);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1.5px solid var(--bio-glow);
            padding: 6px 12px;
            border-radius: 20px;
            background: transparent;
            transition: 0.3s;
        }

        .btn-back-tree:hover {
            background: var(--bio-glow);
            color: var(--void-dark) !important;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        /* --- Sidebar Tree Navigation --- */
        .sidebar-tree {
            width: 280px;
            background: #0d1216;
            border-right: 1px solid #1a2228;
            padding: 100px 25px 25px 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .tree-nav-item {
            position: relative;
            padding: 18px 0 18px 35px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.4s;
            border-left: 2px solid #263238;
            margin-bottom: 2px;
            color: #78909c;
        }

        .tree-nav-item:hover { color: var(--bio-glow); background: rgba(0, 229, 255, 0.05); }
        
        .tree-nav-item.active {
            border-left: 3px solid var(--bio-glow);
            color: white;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.03);
        }

        .tree-nav-item::before {
            content: '💠';
            position: absolute;
            left: -12px;
            top: 18px;
            filter: hue-rotate(180deg);
        }

        /* --- Main Content Area --- */
        .content-container {
            flex: 1;
            padding: 110px 40px 60px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-card {
            max-width: 800px;
            width: 100%;
            background: #0f171a;
            padding: 60px;
            border-radius: 8px;
            border: 1px solid #1a262b;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
            animation: fadeIn 1s ease-out;
        }

        .story-image {
            width: 100%;
            height: 450px;
            background-color: #1a262b;
            margin-bottom: 40px;
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            border-bottom: 2px solid var(--bio-glow);
        }

        h2.chapter-title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: white;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .story-text {
            line-height: 2;
            font-size: 1.2rem;
            margin-bottom: 50px;
            color: #b0bec5;
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1a262b;
            padding-top: 40px;
        }

        .btn-story {
            padding: 14px 35px;
            border: 1px solid var(--bio-glow);
            background: transparent;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--bio-glow);
            transition: 0.3s;
        }

        .btn-story:hover {
            background: var(--bio-glow);
            color: var(--void-dark);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow-y: auto; }
            .top-nav { position: sticky; flex-direction: column; padding: 15px 10px; min-height: auto; }
            .current-part-title { margin-top: 10px; font-size: 0.75rem; }
            
            .sidebar-tree {
                width: 100%; height: auto; flex-direction: row;
                padding: 10px; border-right: none; border-bottom: 1px solid #1a262b;
                overflow-x: auto; white-space: nowrap; position: sticky; top: 85px; z-index: 999;
            }
            .tree-nav-item { padding: 10px 15px; border-left: none; font-size: 0.8rem; border-bottom: 2px solid transparent; }
            .tree-nav-item.active { border-bottom: 2px solid var(--bio-glow); }
            .tree-nav-item::before { display: none; }
            
            .content-container { padding: 20px; overflow-y: visible; }
            .story-card { padding: 25px; }
            .story-image { height: 250px; }
            .mobile-hide { display: none; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
       <a href="memoir.html" class="btn-back-tree">
            <span>🌳</span> Back to Tree
        </a>
        <div class="current-part-title">Part IV: Tree 2129 – The Endless Growth</div>
        <div style="width: 120px;" class="mobile-hide"></div>
    </nav>

    <aside class="sidebar-tree" id="treeNav"></aside>

    <main class="content-container">
        <div class="story-card" id="storyCard">
            <div class="story-image" id="storyImg"></div>
            <h2 class="chapter-title" id="chapterTitle"></h2>
            <div class="story-text" id="storyContent"></div>
            
            <div class="controls">
                <button class="btn-story" id="prevBtn" onclick="prevStory()">← Recall</button>
                <button class="btn-story" id="nextBtn" onclick="nextStory()">Evolve →</button>
            </div>
        </div>
    </main>

    <script>
        const partData = {
            chapters: [
                {
                    title: "The Great Connection",
                    stories: [
                        { text: "By the year 2129, the forest had become a singular organism. Every tree was linked by a digital and biological weave, pulsing with the shared memories of a century of growth.", img: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1200&q=80" },
                        { text: "We no longer spoke of 'me' or 'mine'. The data flowing through the mycelium was the same as the blood flowing through our veins—a constant stream of survival and awareness.", img: "https://images.unsplash.com/photo-1535090467336-9501f96eef89?auto=format&fit=crop&w=1200&q=80" }
                    ]
                },
                {
                    title: "Beyond the Canopy",
                    stories: [
                        { text: "The branches did not stop at the edge of the atmosphere. They reached for the stars, catching starlight not just for energy, but for information. We were no longer terrestrial; we were universal.", img: "https://images.unsplash.com/photo-1506318137071-a8e063b4bcc0?auto=format&fit=crop&w=1200&q=80" }
                    ]
                },
                {
                    title: "The Eternal Ring",
                    stories: [
                        { text: "Growth is no longer a linear journey toward death. It is an endless cycle of expansion and refinement. Tree 2129 stands as a monument to the idea that as long as we remain rooted together, the sky has no ceiling.", img: "https://images.unsplash.com/photo-1478479405421-ce83c92fb3ba?auto=format&fit=crop&w=1200&q=80" }
                    ]
                }
            ]
        };

        let currentChapter = 0;
        let currentStory = 0;

        function init() {
            const nav = document.getElementById('treeNav');
            partData.chapters.forEach((ch, index) => {
                const div = document.createElement('div');
                div.className = `tree-nav-item ${index === 0 ? 'active' : ''}`;
                div.innerText = ch.title;
                div.onclick = () => jumpToChapter(index);
                nav.appendChild(div);
            });
            renderStory();
        }

        function renderStory() {
            const chapter = partData.chapters[currentChapter];
            const story = chapter.stories[currentStory];
            
            const card = document.getElementById('storyCard');
            card.style.animation = 'none';
            card.offsetHeight; 
            card.style.animation = 'fadeIn 1s ease-out';

            document.getElementById('chapterTitle').innerText = chapter.title;
            document.getElementById('storyContent').innerText = story.text;
            document.getElementById('storyImg').style.backgroundImage = `url('${story.img}')`;

            const items = document.querySelectorAll('.tree-nav-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentChapter);
            });

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.innerText = (currentChapter === partData.chapters.length - 1 && currentStory === chapter.stories.length - 1) 
                ? "Ascend to Unity" 
                : "Evolve →";
        }

        function nextStory() {
            if (currentStory < partData.chapters[currentChapter].stories.length - 1) {
                currentStory++;
            } else if (currentChapter < partData.chapters.length - 1) {
                currentChapter++;
                currentStory = 0;
            } else {
                window.location.href = 'memoir.html'; 
                return;
            }
            renderStory();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function prevStory() {
            if (currentStory > 0) {
                currentStory--;
            } else if (currentChapter > 0) {
                currentChapter--;
                currentStory = partData.chapters[currentChapter].stories.length - 1;
            } else {
                window.location.href = 'memoir.html';
            }
            renderStory();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function jumpToChapter(index) {
            currentChapter = index;
            currentStory = 0;
            renderStory();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.onload = init;
    </script>
</body>
</html>
