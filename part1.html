<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part I - Roots Beneath the Soil</title>
    <style>
        :root {
            --earth-dark: #2c1e1a;
            --earth-light: #d7ccc8;
            --leaf-green: #4a7c44;
            --accent-gold: #c5a059;
            --text-color: #3e2723;
            --bg-paper: #fdfaf3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Top Navigation --- */
        .top-nav {
            position: fixed;
                top: 0;
                width: 100%;
                min-height: 70px;
                background: rgba(255, 255, 255, 0.98);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 10px 20px;
                z-index: 100;
                border-bottom: 1px solid rgba(0,0,0,0.1);
                backdrop-filter: blur(10px);
        }

        /* Center Title Style */
        .current-part-title {
            flex: 1;
                text-align: center;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-weight: bold;
                font-size: 0.9rem;
                color: var(--earth-dark);
                padding: 0 10px;
        }

        .btn-back-tree {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--leaf-green);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1.5px solid var(--leaf-green);
            padding: 6px 12px;
            border-radius: 20px;
            background: white;
        }

        .btn-back-tree:hover {
            background: var(--leaf-green);
            color: white !important;
            box-shadow: 0 4px 12px rgba(74, 124, 68, 0.2);
        }

        /* --- Sidebar Tree Navigation --- */
        .sidebar-tree {
            width: 280px;
            background: #f4eee1;
            border-right: 1px solid #e0d8c3;
            padding: 100px 25px 25px 25px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .tree-nav-item {
            position: relative;
            padding: 18px 0 18px 35px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.4s;
            border-left: 2px solid #dcd3bd;
            margin-bottom: 2px;
            color: #7a6e60;
        }

        .tree-nav-item:hover { color: var(--leaf-green); background: rgba(255,255,255,0.3); }
        
        .tree-nav-item.active {
            border-left: 3px solid var(--leaf-green);
            color: var(--earth-dark);
            font-weight: bold;
            background: white;
        }

        .tree-nav-item::before {
            content: '🌿';
            position: absolute;
            left: -12px;
            top: 18px;
            filter: grayscale(1);
            transition: 0.3s;
        }

        .tree-nav-item.active::before { filter: grayscale(0); }

        /* --- Main Content Area --- */
        .content-container {
            flex: 1;
            padding: 110px 40px 60px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .story-card {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 60px;
            border-radius: 4px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.03);
            animation: fadeIn 0.8s ease-out;
        }

        .story-image {
            width: 100%;
            height: 450px;
            background-color: #f0f0f0;
            margin-bottom: 40px;
            background-size: cover;
            background-position: center;
            border-radius: 2px;
        }

        h2.chapter-title {
            font-size: 2.2rem;
            margin-bottom: 30px;
            color: var(--earth-dark);
            font-weight: 400;
        }

        .story-text {
            line-height: 2.2;
            font-size: 1.2rem;
            margin-bottom: 50px;
            color: #444;
        }

        /* --- Controls --- */
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            width: 100%;
            border-top: 1px solid #f0f0f0;
            padding-top: 40px;
        }

        .btn-story {
            padding: 14px 35px;
            border: 1px solid var(--earth-dark);
            background: transparent;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--earth-dark);
        }

        .btn-story:hover {
            background: var(--earth-dark);
            color: white;
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .top-nav { flex-direction: column; /* Stacked for clear visibility */
        height: auto;
        padding: 15px 10px; }
            .current-part-title { margin-top: 10px;
        font-size: 0.8rem;
        letter-spacing: 1px;} 
            .sidebar-tree {
                width: 100%;
                height: auto;
                flex-direction: row;
                padding: 70px 10px 10px 10px;
                border-right: none;
                border-bottom: 1px solid #e0d8c3;
                margin-top: 15px;
            }
            .tree-nav-item { padding: 12px; border-left: none; font-size: 0.75rem; border-bottom: 2px solid transparent; }
            .tree-nav-item::before { display: none; }
            .tree-nav-item.active { border-bottom: 2px solid var(--leaf-green); border-left: none; }
            .content-container { padding: 20px; }
            .story-card { padding: 30px; }
            .story-image { height: 280px; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="memoir.html" class="btn-back-tree">
            <span>🌳</span> Back to Tree
        </a>

        <div class="current-part-title">
            Part I: Roots Beneath the Soil
        </div>
        
        <div style="width: 120px;" class="mobile-hide"></div>
    </nav>

    <aside class="sidebar-tree" id="treeNav">
        </aside>

    <main class="content-container">
        <div class="story-card" id="storyCard">
            <div class="story-image" id="storyImg"></div>
            <h2 class="chapter-title" id="chapterTitle"></h2>
            <div class="story-text" id="storyContent"></div>
            
            <div class="controls">
                <button class="btn-story" id="prevBtn" onclick="prevStory()">← Previous</button>
                <button class="btn-story" id="nextBtn" onclick="nextStory()">Next →</button>
            </div>
        </div>
    </main>

    <script>
        const partData = {
            chapters: [
                {
                    title: "Chapter 1: The Seed That Knew Silence",
                    stories: [
                        { text: "Before the sky was a memory, there was only the weight of the damp earth. The seed did not fear the dark; it was born from it. It felt the slow, rhythmic pulse of the planet, a heartbeat made of shifting tectonic plates and cooling stone.", img: "https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&w=1200&q=80" },
                        { text: "It listened to the vibrations of footsteps far above—heavy, hurried, and unaware of the life gathering strength below. Every footfall was a message from a world that had forgotten how to be still.", img: "https://images.unsplash.com/photo-1502082553048-f009c37129b9?auto=format&fit=crop&w=1200&q=80" }
                    ]
                },
                {
                    title: "Chapter 2: Water That Never Returned",
                    stories: [
                        { text: "The first rain was a blessing, a cold kiss that broke the dormancy. But then, the sky turned to iron. The moisture retreated, leaving the soil brittle and gasping. The roots had to learn to hunt, stretching deeper into the unknown to find what the sky would no longer provide.", img: "https://images.unsplash.com/photo-1473081556163-2a17de81fc97?auto=format&fit=crop&w=1200&q=80" }
                    ]
                },
                {
                    title: "Chapter 3: The Boy Who Looked Up",
                    stories: [
                        { text: "A small hand brushed the dirt away. For the first time, the seed felt the warmth of a sun it had never seen. The boy didn't speak, but his shadow felt like a promise of protection, a silent pact between the earth and those who walk upon it.", img: "https://images.unsplash.com/photo-1508849739987-010b45bcb970?auto=format&fit=crop&w=1200&q=80" }
                    ]
                }
            ]
        };

        let currentChapter = 0;
        let currentStory = 0;

        function init() {
            const nav = document.getElementById('treeNav');
            partData.chapters.forEach((ch, index) => {
                const div = document.createElement('div');
                div.className = `tree-nav-item ${index === 0 ? 'active' : ''}`;
                div.innerText = ch.title;
                div.onclick = () => jumpToChapter(index);
                nav.appendChild(div);
            });
            renderStory();
        }

        function renderStory() {
            const chapter = partData.chapters[currentChapter];
            const story = chapter.stories[currentStory];
            
            const card = document.getElementById('storyCard');
            card.style.animation = 'none';
            card.offsetHeight; 
            card.style.animation = 'fadeIn 0.8s ease-out';

            document.getElementById('chapterTitle').innerText = chapter.title;
            document.getElementById('storyContent').innerText = story.text;
            document.getElementById('storyImg').style.backgroundImage = `url('${story.img}')`;

            const items = document.querySelectorAll('.tree-nav-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentChapter);
            });

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.innerText = (currentChapter === partData.chapters.length - 1 && currentStory === chapter.stories.length - 1) 
                ? "Finish Part I" 
                : "Next →";
        }

        function nextStory() {
            if (currentStory < partData.chapters[currentChapter].stories.length - 1) {
                currentStory++;
            } else if (currentChapter < partData.chapters.length - 1) {
                currentChapter++;
                currentStory = 0;
            } else {
                window.location.href = 'memoir.html'; 
                return;
            }
            renderStory();
        }

        function prevStory() {
            if (currentStory > 0) {
                currentStory--;
            } else if (currentChapter > 0) {
                currentChapter--;
                currentStory = partData.chapters[currentChapter].stories.length - 1;
            } else {
                window.location.href = 'memoir.html';
            }
            renderStory();
        }

        function jumpToChapter(index) {
            currentChapter = index;
            currentStory = 0;
            renderStory();
        }

        window.onload = init;
    </script>
</body>
</html>
